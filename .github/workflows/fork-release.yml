name: Fork Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/fork-ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontendv2
            context: frontendv2
          - image: mcp
            context: mcp
          - image: async-runner
            context: runner
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          test "$(node -p "require('./frontendv2/package.json').version")" = "$version"
          grep -Fq "define('APP_VERSION', '$tag');" backend/public/index.php
          grep -Fq "define('APP_VERSION', '$tag');" backend/cli
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/featherpanel-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.name }}/featherpanel-${{ matrix.image }}:latest

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=tar.gz --prefix="FeatherPanel-${GITHUB_REF_NAME}/" -o "FeatherPanel-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          files: FeatherPanel-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
